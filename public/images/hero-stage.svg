<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="ledScreen" x1="240" y1="160" x2="960" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="75%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="coneBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coneRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#heroBg)"/>
  <!-- Stage Truss System -->
  <rect x="90" y="70" width="1020" height="26" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <path d="M90 70 L130 96 L170 70 L210 96 L250 70 L290 96 L330 70 L370 96 L410 70 L450 96 L490 70 L530 96 L570 70 L610 96 L650 70 L690 96 L730 70 L770 96 L810 70 L850 96 L890 70 L930 96 L970 70 L1010 96 L1050 70 L1090 96 L1110 70" stroke="#475569" stroke-width="2" fill="none"/>
  <rect x="95" y="96" width="24" height="470" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="1081" y="96" width="24" height="470" fill="#0F172A" stroke="#334155" stroke-width="2"/>

  <!-- Stage Lighting Beams -->
  <polygon points="220,96 70,580 370,580" fill="url(#coneBlue)"/>
  <polygon points="460,96 310,580 610,580" fill="url(#coneRed)"/>
  <polygon points="740,96 590,580 890,580" fill="url(#coneRed)"/>
  <polygon points="980,96 830,580 1130,580" fill="url(#coneBlue)"/>

  <!-- Main P2 Widescreen LED Wall -->
  <rect x="230" y="155" width="740" height="330" rx="10" fill="#090D16" stroke="#38BDF8" stroke-width="3"/>
  <rect x="242" y="167" width="716" height="306" rx="6" fill="url(#ledScreen)" opacity="0.9"/>
  <!-- LED Wall Grid Overlay -->
  <g stroke="#090D16" stroke-width="2" opacity="0.35">
    <line x1="361" y1="167" x2="361" y2="473"/>
    <line x1="480" y1="167" x2="480" y2="473"/>
    <line x1="600" y1="167" x2="600" y2="473"/>
    <line x1="719" y1="167" x2="719" y2="473"/>
    <line x1="838" y1="167" x2="838" y2="473"/>
    <line x1="242" y1="269" x2="958" y2="269"/>
    <line x1="242" y1="371" x2="958" y2="371"/>
  </g>
  <!-- Center Graphic on LED Wall -->
  <circle cx="600" cy="320" r="88" fill="#090D16" fill-opacity="0.55" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="580,285 642,320 580,355" fill="#F43F5E"/>
  <text x="600" y="438" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="4">LIVEON CONNECT · STAGE PRODUCTION</text>

  <!-- Left & Right Line Array Sound Stacks -->
  <g fill="#0F172A" stroke="#475569" stroke-width="2">
    <rect x="140" y="140" width="68" height="28" rx="4"/>
    <rect x="140" y="172" width="68" height="28" rx="4"/>
    <rect x="140" y="204" width="68" height="28" rx="4"/>
    <rect x="140" y="236" width="68" height="28" rx="4"/>
    <rect x="140" y="268" width="68" height="28" rx="4"/>
    <rect x="992" y="140" width="68" height="28" rx="4"/>
    <rect x="992" y="172" width="68" height="28" rx="4"/>
    <rect x="992" y="204" width="68" height="28" rx="4"/>
    <rect x="992" y="236" width="68" height="28" rx="4"/>
    <rect x="992" y="268" width="68" height="28" rx="4"/>
  </g>
  <!-- Floor Subwoofers -->
  <g fill="#1E293B" stroke="#3B82F6" stroke-width="2">
    <rect x="130" y="485" width="90" height="75" rx="6"/>
    <circle cx="175" cy="522" r="24" fill="#090D16"/>
    <rect x="230" y="505" width="80" height="55" rx="6"/>
    <rect x="890" y="505" width="80" height="55" rx="6"/>
    <rect x="980" y="485" width="90" height="75" rx="6"/>
    <circle cx="1025" cy="522" r="24" fill="#090D16"/>
  </g>

  <!-- Stage Deck -->
  <polygon points="40,560 1160,560 1200,680 0,680" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="590" x2="1120" y2="590" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Beam Spot Fixtures -->
  <circle cx="220" cy="96" r="10" fill="#E0F2FE"/>
  <circle cx="460" cy="96" r="10" fill="#FFE4E6"/>
  <circle cx="740" cy="96" r="10" fill="#FFE4E6"/>
  <circle cx="980" cy="96" r="10" fill="#E0F2FE"/>
</svg>